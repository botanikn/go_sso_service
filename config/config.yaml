# Local development config. Secrets are not stored here:
env: local
db:
  driver: postgres
  host: localhost
  port: 5432
  dbname: sso_db
  sslmode: disable
grpc:
  port: 50051
  timeout: 10s
  # tls_cert_file: ./certs/server.crt
  # tls_key_file: ./certs/server.key
token_ttl: 1h
issuer: go_sso_service
rate_limit:
  requests: 10
  window: 1m
